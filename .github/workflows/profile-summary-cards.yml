name: Profile Summary Cards

on:
  schedule:
    # 06:00 em Brasília (UTC-3)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar e commitar os cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Gerar cards do perfil
        uses: vn7n24fzkq/github-profile-summary-cards@v0.11.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: -3
